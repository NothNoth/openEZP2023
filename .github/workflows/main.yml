name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Must come first: web/embed.go embeds ezp.wasm, which only exists
      # after a build, so vet and test cannot compile on a fresh checkout.
      - name: Build dist
        run: make dist

      - name: Vet
        run: |
          go vet ./...
          GOOS=js GOARCH=wasm go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: WebAssembly smoke test
        run: node test/wasm-smoke.mjs dist

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          include-hidden-files: true   # keep .htaccess
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Package
        run: |
          name="openEZP2023-${GITHUB_REF_NAME}"
          (cd dist && zip -qr "../${name}.zip" .)
          sha256sum "${name}.zip" > "${name}.zip.sha256"
          echo "ASSET=${name}.zip" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --verify-tag)
          # Tags such as v1.2.0-rc1 are published as pre-releases.
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" "${flags[@]}"