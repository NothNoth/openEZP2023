# nginx: add to the server { } block that serves the dist/ folder over HTTPS.

location /ezp2023/ {               # adapt the path, or use "location /"
    alias /var/www/ezp2023/;       # where dist/ was copied

    # Recent nginx versions already map .wasm in mime.types; this is for older ones.
    types {
        text/html               html;
        application/javascript  js;
        application/wasm        wasm;
        font/woff2              woff2;
    }

    gzip on;
    gzip_types application/javascript application/wasm;

    location ~ \.html$ { add_header Cache-Control "no-cache"; }
    location ~ \.(js|wasm|woff2)$ { add_header Cache-Control "public, max-age=31536000, immutable"; }
}
